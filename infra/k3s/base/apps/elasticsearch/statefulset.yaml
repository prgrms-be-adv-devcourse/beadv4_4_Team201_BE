apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: giftify
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      automountServiceAccountToken: false
      containers:
        - name: elasticsearch
          image: giftify-elasticsearch:local
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "true"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          envFrom:
            - secretRef:
                name: es-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -u elastic:$ELASTIC_PASSWORD -sfk https://127.0.0.1:9200/_cluster/health || exit 1"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -u elastic:$ELASTIC_PASSWORD -sfk https://127.0.0.1:9200/_cluster/health || exit 1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -u elastic:$ELASTIC_PASSWORD -sfk https://127.0.0.1:9200/_cluster/health || exit 1"]
            initialDelaySeconds: 150
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
