name: cd-ghcr-amazon-linux

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 이미지 이름을 소문자로 변환 (Docker 규칙)
      - name: Set lower case owner and repository name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 2. JDK 17 설정 (컴파일용)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 빌드 (JAR 파일 생성)
      # bootstrap 모듈에서 실행해야 하므로 해당 모듈을 빌드합니다.
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :bootstrap:build -x test

      # 4. GHCR 로그인
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 이미지 빌드 & 푸시
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: . # 루트 기준으로 파일을 찾음
          file: ./bootstrap/api-server/Dockerfile # Dockerfile 위치 지정
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. EC2 배포 (Nginx Upstream 스위칭)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 소문자 이미지명 처리
            LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE=ghcr.io/$LOWER_REPO:${{ github.sha }}
            UPSTREAM_CONF=/etc/nginx/conf.d/upstream.inc

            # GHCR 로그인
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 현재 활성 포트 확인 및 신규 포트 결정
            if [ ! -f $UPSTREAM_CONF ] || grep -q "8081" $UPSTREAM_CONF; then
              ACTIVE=blue; NEW=green; PORT=8082
            else
              ACTIVE=green; NEW=blue; PORT=8081
            fi

            echo ">>> [Deploy] Active: $ACTIVE, Target: $NEW (Port: $PORT)"

            # 이미지 Pull 및 컨테이너 교체
            docker pull $IMAGE
            docker rm -f api-server-$NEW || true

            # 신규 컨테이너 실행
            docker run -d \
              --name api-server-$NEW \
              -p $PORT:8080 \
              --restart always \
              -e SPRING_PROFILES_ACTIVE=prod \
              $IMAGE

            # 헬스 체크 (최대 60초)
            echo ">>> Health checking for $NEW..."
            SUCCESS=0
            for i in {1..12}; do
              if curl -sf http://localhost:$PORT/health > /dev/null; then
                echo "✅ Health check passed!"
                SUCCESS=1
                break
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done

            if [ $SUCCESS -eq 0 ]; then
              echo "❌ Deployment failed: $NEW did not start."
              docker logs api-server-$NEW
              exit 1
            fi

            # Nginx 업스트림 변경
            echo "server 127.0.0.1:$PORT;" | sudo tee $UPSTREAM_CONF
            
            # Nginx 리로드
            if sudo nginx -t; then
              sudo nginx -s reload
              echo "🚀 Nginx Switched to $NEW ($PORT)."
            else
              echo "❌ Nginx Config Error!"
              exit 1
            fi

            # 이전 컨테이너 정리
            echo ">>> Stopping old container ($ACTIVE)..."
            sleep 10
            docker stop api-server-$ACTIVE || true
            
            # 정리
            docker image prune -f
            echo ">>> DONE!"