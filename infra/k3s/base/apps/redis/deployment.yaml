apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command: [ "redis-server", "--requirepass", "$(REDIS_PASSWORD)" ]
          ports:
            - containerPort: 6379
          envFrom:
            - secretRef:
                name: redis-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli -a $REDIS_PASSWORD ping | grep PONG" ]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli -a $REDIS_PASSWORD ping | grep PONG" ]
            initialDelaySeconds: 15
            periodSeconds: 30
