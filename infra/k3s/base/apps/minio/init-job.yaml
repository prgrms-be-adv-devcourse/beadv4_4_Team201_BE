apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: [ "sh", "-c", "until nc -z minio 9000; do echo 'waiting for minio...'; sleep 2; done" ]
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/giftify-bucket
              mc anonymous set download local/giftify-bucket/products
              mc anonymous set download local/giftify-bucket/profiles
          envFrom:
            - secretRef:
                name: minio-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
