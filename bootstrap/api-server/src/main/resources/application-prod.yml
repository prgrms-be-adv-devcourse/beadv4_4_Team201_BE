spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false  # 운영 환경에서는 비활성화

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    app.giftify: INFO