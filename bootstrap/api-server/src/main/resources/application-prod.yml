spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false  # 운영 환경에서는 비활성화

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: g7app

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    schemas: g7app
    default-schema: g7app
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  batch:
    jdbc:
      initialize-schema: never   # Batch 메타데이터 테이블 직접 생성 필요
    job:
      enabled: false              # 기동 시 배치 잡 자동 실행 방지


logging:
  level:
    root: WARN
    app.giftify: INFO


management:
  metrics:
    tags:
      application: ${spring.application.name:giftify}
      env: prod
