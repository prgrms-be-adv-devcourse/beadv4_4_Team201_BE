on:
  push:
    branches: [ "main", "feature/246-cd-script-v2" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  packages: read

jobs:
  # 1. 빌드 (재사용 워크플로우 호출)
  build:
    uses: ./.github/workflows/_build.yml
    with:
      java-version: '21'
      run-tests: false
      generate-coverage: false
      upload-jar: true

  deploy:
    name: Deploy to K3s
    runs-on: self-hosted
    if: >-
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'

    steps:
      - name: Set image tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event.workflow_run.head_branch }}" == v* ]]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_branch }}"
          else
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
            IMAGE_TAG="${IMAGE_TAG::7}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo ">>> 배포 이미지 태그: ${IMAGE_TAG}"

      - name: Deploy
        env:
          GH_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GH_PAT: ${{ secrets.GHCR_PAT }}
        run: ~/infra/k3s/scripts/k3s-ec2-deploy.sh "${{ env.IMAGE_TAG }}"

      - name: Show status
        if: always()
        run: |
          kubectl get pods -n giftify
          kubectl get deployments -n giftify

