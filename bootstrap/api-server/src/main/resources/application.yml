spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: giftify-be
  profiles:
    # 기본적으로 포함할 모듈별 공통 설정
    include:
      - auth
    # 환경별 프로파일 그룹 정의
    # 예: local 프로파일로 실행 시, auth-local 프로파일도 활성화되어 application-auth-local.yml을 로드 시도함
    group:
      local:
        - auth-local
      dev:
        - auth-dev
      prod:
        - auth-prod

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    app.giftify: DEBUG
