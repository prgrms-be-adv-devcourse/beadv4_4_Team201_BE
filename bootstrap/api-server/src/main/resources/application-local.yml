spring:
  datasource:
    url: jdbc:h2:mem:giftify;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms  #  연결 타임아웃

management:
  metrics:
    tags:
      application: ${spring.application.name:giftify}
      env: local
