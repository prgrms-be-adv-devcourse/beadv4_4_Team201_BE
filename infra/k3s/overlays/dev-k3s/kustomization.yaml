apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/prgrms-be-adv-devcourse/beadv4_4_team201_be/api-server
    newName: giftify-backend
    newTag: local

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            imagePullSecrets: [ ]
            containers:
              - name: backend
                imagePullPolicy: Never
                env:
                  - name: SPRING_SQL_INIT_MODE
                    value: "never"
                  - name: SPRING_BATCH_JDBC_INITIALIZE_SCHEMA 
                    value: "always" # 이거 prod 에서는 직접 테이블 만들게 바꿔야 함
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "200m"
                  limits:
                    memory: "768Mi"
                    cpu: "500m"
                startupProbe:
                  httpGet:
                    path: /actuator/health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 60
                readinessProbe:
                  initialDelaySeconds: 5
                livenessProbe:
                  initialDelaySeconds: 10
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
      spec:
        replicas: 0
