apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-image-updater-controller
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-image-updater
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["argocd-image-updater.argoproj.io"]
    resources: ["imageupdaters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-image-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-image-updater
subjects:
  - kind: ServiceAccount
    name: argocd-image-updater-controller
    namespace: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: argocd-image-updater-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-image-updater
        control-plane: argocd-image-updater-controller
    spec:
      serviceAccountName: argocd-image-updater-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: argocd-image-updater-controller
          image: quay.io/argoprojlabs/argocd-image-updater:v1.1.1
          command: ["/manager"]
          args: ["--metrics-bind-address=:8443", "run"]
          env:
            - name: ARGOCD_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: argocd.namespace
                  name: argocd-image-updater-config
                  optional: true
            - name: IMAGE_UPDATER_INTERVAL
              valueFrom:
                configMapKeyRef:
                  key: interval
                  name: argocd-image-updater-config
                  optional: true
            - name: IMAGE_UPDATER_LOGLEVEL
              valueFrom:
                configMapKeyRef:
                  key: log.level
                  name: argocd-image-updater-config
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /app/config
              name: image-updater-conf
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: image-updater-conf
          configMap:
            name: argocd-image-updater-config
            optional: true
            items:
              - key: registries.conf
                path: registries.conf
        - name: tmp
          emptyDir: {}
