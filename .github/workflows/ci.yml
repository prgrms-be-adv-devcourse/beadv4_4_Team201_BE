# CI Pipeline (Merge)
# main/develop 브랜치 푸시 시 빠른 검증
name: CI

on:
  push:
    branches: [ develop, main ]
    tags-ignore: [ '**' ]

jobs:
  # 1. 빌드 및 테스트 (Fast Mode)
  build:
    name: Build & Test
    uses: ./.github/workflows/_build.yml
    with:
      java-version: '21'
      run-tests: true
      # 머지 단계에서는 커버리지 리포트 생략 (PR에서 이미 검증됨)
      generate-coverage: false
      # 배포용 jar 업로드
      upload-jar: true
      publish-build-scan: true

  # 2. 보안 스캔 (선택적)
  security-scan:
    name: Security Scan
    needs: [ build ]
    runs-on: ubuntu-latest
    # develop 브랜치에서만 실행 (main은 배포 속도 우선)
    if: github.ref_name == 'develop'
    permissions:
      contents: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      # Dependency Graph 제출 (레포 설정에서 활성화 필요)
      # Settings > Code security > Dependency graph 활성화
      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v4
        continue-on-error: true  # 레포 설정 미완료 시에도 워크플로 중단 방지

      # 소스 코드 취약점 스캔
      - name: Code Vulnerability Scan
        uses: anchore/scan-action@v4
        id: scan
        with:
          path: "${{ github.workspace }}"
          fail-build: false
          severity-cutoff: high

      # SARIF 업로드 (스캔 성공 시에만)
      - name: Upload Vulnerability Report
        if: steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
