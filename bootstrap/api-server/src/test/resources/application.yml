spring:
  datasource:
    url: jdbc:h2:mem:outbox-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true

  flyway:
    enabled: false

  jackson:
    use-jackson2-defaults: true

  batch:
    job:
      enabled: false


logging:
  level:
    org.springframework.modulith: DEBUG

internal-api:
  base-url: http://localhost:8080
