apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-ingress
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api-server.localhost`)
      kind: Rule
      services:
        - name: api-server
          port: 8080
      middlewares:
        - name: rate-limit
        - name: forwarded-proto-https
