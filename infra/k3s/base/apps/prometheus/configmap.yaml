apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'giftify-api'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['backend:8080']

      - job_name: 'redpanda'
        metrics_path: '/public_metrics'
        static_configs:
          - targets: ['redpanda:9644']
