spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: giftify-be

  modulith: {}

  profiles:
    # active 프로파일을 여기서 고정 X
    #
    # [실행 가이드]
    # - 로컬 개발:
    #     -Dspring.profiles.active=local
    #
    # - 개발 서버:
    #     -Dspring.profiles.active=dev
    #
    # - 운영 서버:
    #     -Dspring.profiles.active=prod
    #
    # 실수로 운영 환경에서 local/dev 설정이 적용되는 것을 방지하기 위함

    group:
      local:
        - auth-local
        - catalog-local
        - core-local
        - money-local
        - member-local
        - funding-local
        - order-local
        - settlement-local
      dev:
        - auth-dev
        - catalog-dev
        - core-dev
        - money-dev
        - member-dev
        - funding-dev
        - order-dev
        - settlement-dev
      prod:
        - auth-prod
        - catalog-prod
        - core-prod
        - money-prod
        - member-prod
        - funding-prod
        - order-prod
        - settlement-prod
      staging:
        - auth-staging

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    app.giftify: DEBUG

giftify:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      image-bucket: ${S3_IMAGE_BUCKET:giftify-images}
