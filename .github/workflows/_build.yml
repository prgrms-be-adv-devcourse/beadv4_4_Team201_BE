# Reusable Build Workflow
# 다른 워크플로우에서 workflow_call로 호출하여 재사용

name: Reusable Build

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        default: '21'
        type: string
      run-tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
      generate-coverage:
        description: 'Generate Jacoco coverage report'
        required: false
        default: true
        type: boolean
      upload-jar:
        description: 'Upload application jar for deployment'
        required: false
        default: false
        type: boolean
      publish-build-scan:
        description: 'Publish Gradle Build Scan'
        required: false
        default: true
        type: boolean
    outputs:
      build-outcome:
        description: 'Build outcome (success/failure)'
        value: ${{ jobs.build.outputs.outcome }}
      build-scan:
        description: 'Gradle Build Scan URL'
        value: ${{ jobs.build.outputs.build-scan }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.gradle-build.outcome }}
      build-scan: ${{ steps.gradle-build.outputs.build-scan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: ${{ inputs.publish-build-scan }}
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          # main/develop 이외의 브랜치에서는 캐시를 읽기만 함 (캐시 오염 방지)
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        id: gradle-build
        # clean 제거: GitHub Actions는 매번 새 환경이므로 불필요
        run: ./gradlew build --parallel ${{ inputs.generate-coverage && 'jacocoAggregatedReport' || '' }}

      # 배포용 Jar 업로드 (옵션)
      - name: Upload application jar
        if: inputs.upload-jar
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-plain.jar
          retention-days: 1

      # Jacoco 리포트 업로드 (coverage 활성화 시)
      - name: Upload Jacoco report
        if: inputs.generate-coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/aggregated/
          retention-days: 7

      # 테스트 결과 업로드 (실패 시 또는 coverage 활성화 시)
      - name: Upload test results
        if: inputs.run-tests && (failure() || inputs.generate-coverage)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/'
          retention-days: 7

