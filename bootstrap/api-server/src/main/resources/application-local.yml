spring:

  datasource:
    url: jdbc:h2:mem:giftify;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  elasticsearch:
    uris: http://localhost:9200 # ES는 HTTP REST API로 통신하기 때문에 전체 URL을 지정하는 uris를 사용

  sql:
    init:
      mode: always
      data-locations: classpath:data-local.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms  #  연결 타임아웃

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false              # 기동 시 배치 잡 자동 실행 방지

  flyway:
    enabled: false


management:
  metrics:
    tags:
      application: ${spring.application.name:giftify}
      env: local
