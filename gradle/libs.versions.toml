[versions]
# =============================================================================
# Core Versions
# =============================================================================
springBoot = "4.0.3"
springDependencyManagement = "1.1.7"
springModulith = "2.0.3"
jmolecules = "2.0.1"

# =============================================================================
# Database & ORM
# =============================================================================
postgresql = "42.7.3"
h2 = "2.2.224"
querydsl = "5.1.0"

# =============================================================================
# Security
# =============================================================================
jwt = "4.4.0"

# =============================================================================
# Utilities
# =============================================================================
lombok = "1.18.42"
dotenv = "3.0.0"

# =============================================================================
# Object Storage (AWS SDK v2 — MinIO 호환)
# =============================================================================
awssdk = "2.44.9"

# =============================================================================
# Testing
# =============================================================================
archunit = "1.3.0"
restAssured = "5.4.0"
testcontainers = "2.0.3"
testcontainersRedis = "2.2.4"

# =============================================================================
# Monitoring & Docs
# =============================================================================
micrometer = "1.12.2"
springdoc = "3.0.2"

[libraries]
# =============================================================================
# Spring Boot Starters (버전은 BOM에서 관리)
# =============================================================================
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-batch-jdbc = { module = "org.springframework.boot:spring-boot-starter-batch-jdbc" }
spring-boot-starter-data-redis-test = { module = "org.springframework.boot:spring-boot-starter-data-redis-test" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj", version.ref = "springBoot" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-jackson2 = { module = "org.springframework.boot:spring-boot-jackson2" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
spring-boot-h2console = { module = "org.springframework.boot:spring-boot-h2console" }
# =============================================================================
# Spring Modulith
# =============================================================================
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-starter-core", version.ref = "springModulith" }
spring-modulith-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa", version.ref = "springModulith" }
spring-modulith-test = { module = "org.springframework.modulith:spring-modulith-starter-test", version.ref = "springModulith" }
spring-modulith-events-api = { module = "org.springframework.modulith:spring-modulith-events-api", version.ref = "springModulith" }
spring-modulith-kafka = { module = "org.springframework.modulith:spring-modulith-events-kafka", version.ref = "springModulith" }
spring-modulith-runtime = { module = "org.springframework.modulith:spring-modulith-runtime", version.ref = "springModulith" }
jmolecules-events = { module = "org.jmolecules:jmolecules-events", version.ref = "jmolecules" }

# =============================================================================
# Spring Security
# =============================================================================
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# =============================================================================
# Database
# =============================================================================
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# =============================================================================
# QueryDSL
# =============================================================================
querydsl-jpa = { module = "com.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "com.querydsl:querydsl-apt", version.ref = "querydsl" }

# =============================================================================
# Jakarta (for QueryDSL annotation processing)
# =============================================================================
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }

# =============================================================================
# Lombok
# =============================================================================
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# =============================================================================
# Security & Utils
# =============================================================================
java-jwt = { module = "com.auth0:java-jwt", version.ref = "jwt" }
dotenv = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }
spring-retry = { module = "org.springframework.retry:spring-retry", version = "2.0.11" }
commons-lang3 = { module = "org.apache.commons:commons-lang3" }

# =============================================================================
# Testing
# =============================================================================
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-elasticsearch = { module = "org.testcontainers:testcontainers-elasticsearch", version.ref = "testcontainers" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainersRedis" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# =============================================================================
# Monitoring & Documentation
# =============================================================================
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
hibernate-micrometer = { module = "org.hibernate.orm:hibernate-micrometer" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
