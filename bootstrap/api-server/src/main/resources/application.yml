spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: giftify-be

  profiles:
    include:
      - auth
    group:
      local:
        - auth-local
      dev:
        - auth-dev
      prod:
        - auth-prod

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    app.giftify: DEBUG
