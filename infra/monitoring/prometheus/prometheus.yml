global:
  scrape_interval: 15s        # scrape_interval: 15s → 15초마다 메트릭 수집 (너무 짧으면 부하, 너무 길면 정밀도↓)
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'giftify-api'
    metrics_path: '/actuator/prometheus'  # metrics_path → Spring Actuator 기본 경로는 /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']  # IDE에서 실행 시 호스트 머신 접근용 (Docker 내부 배포 시 'api-server:8080'으로 원복)
