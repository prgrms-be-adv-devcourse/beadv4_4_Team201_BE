apiVersion: batch/v1
kind: Job
metadata:
  name: k6-smoke-test
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["k6", "run", "/scripts/smoke-test.js"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      restartPolicy: Never
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
