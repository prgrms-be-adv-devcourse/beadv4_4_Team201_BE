services:
  #### Application Service ####
  api-server:
    build:
      context: .
      dockerfile: bootstrap/api-server/Dockerfile
    platform: linux/amd64
    container_name: giftify-api-server
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Database 환경 변수
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Auth0 환경 변수
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # Redis 환경 변수
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-giftify-secret}
      # Payment 암호화 환경 변수
      PAYMENT_ENCRYPTION_PASSWORD: ${PAYMENT_ENCRYPTION_PASSWORD:-dev-encryption-password}
      PAYMENT_ENCRYPTION_SALT: ${PAYMENT_ENCRYPTION_SALT:-deadbeefcafebabe}
      # TossPayments 환경 변수
      TOSSPAYMENTS_API_BASE_URL: ${TOSSPAYMENTS_API_BASE_URL:-https://api.tosspayments.com}
      TOSSPAYMENTS_SECRET_KEY: ${TOSSPAYMENTS_SECRET_KEY}
      # Kafka 환경 변수
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - giftify-network
    restart: unless-stopped

  #### Backing Service ####
  postgres:
    image: postgres:16-alpine
    container_name: giftify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - giftify-network

  redpanda:
    image: redpandadata/redpanda:v25.3.7
    container_name: giftify-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --advertise-kafka-addr
      - localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - giftify-network

  redpanda-console:
    image: redpandadata/console:v2.8.0
    container_name: giftify-redpanda-console
    ports:
      - "8090:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - giftify-network

  redis:
    image: redis:7-alpine
    container_name: giftify-redis-session
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 100mb
      --maxmemory-policy volatile-ttl
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - giftify-network
    restart: unless-stopped


  prometheus: # 별도 depends_on 없이 → Prometheus가 api-server 없어도 시작 가능하게 (scrape 실패만 발생)
    image: prom/prometheus:v2.48.0
    container_name: giftify-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # :ro (read-only) → 설정 파일은 컨테이너가 수정할 필요 없음
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'  # retention.time=7d → 데이터 ttl, 디스크 절약을 위해 7일 이하로
    networks:
      - giftify-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: giftify-grafana
    ports:
      - "3333:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - giftify-network
    restart: unless-stopped
  elasticsearch:
    image: elasticsearch:9.2.4
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node # 클러스터 구성없이 단일 노드로 동작. 로컬/개발 환경에서 표준적인 설정
      - xpack.security.enabled=false # ES 8.x부터 보안이 기본 활성화라서, 개발 환경에서 인증 없이 접근하려면 꺼야 함 (배포 환경은 true, prod.yml에 name & pw 환경변수 필수)
    command: >
      bash -c "
      if [ ! -d 'plugins/analysis-nori' ]; then elasticsearch-plugin install --batch analysis-nori; fi &&
      if [ ! -d 'plugins/analysis-icu' ]; then elasticsearch-plugin install --batch analysis-icu; fi &&
      docker-entrypoint.sh elasticsearch
      "
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
  kibana: # Elasticsearch에 저장된 데이터를 쿼리, 분석, 시각화 및 관리하기 위한 오픈 소스 인터페이스
    image: kibana:9.2.4
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

#### Docker Volumes ####
volumes:
  postgres_data:
    driver: local
  redpanda_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis-data:

#### Docker Networks ####
networks:
  giftify-network:
    driver: bridge
