apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: giftify

resources:
  - namespace.yaml
  # API Server
  - apps/api-server/deployment.yaml
  - apps/api-server/service.yaml
  # PostgreSQL
  - apps/postgres/statefulset.yaml
  - apps/postgres/service.yaml
  # Redis
  - apps/redis/deployment.yaml
  - apps/redis/service.yaml
  # Prometheus
  - apps/prometheus/configmap.yaml
  - apps/prometheus/deployment.yaml
  - apps/prometheus/service.yaml
  # Grafana
  - apps/grafana/configmap.yaml
  - apps/grafana/deployment.yaml
  - apps/grafana/service.yaml
  # Red-panda
  - apps/redpanda/deployment.yaml
  - apps/redpanda/service.yaml
  - apps/redpanda/console-deployment.yaml
  - apps/redpanda/console-service.yaml
  # MinIO (S3 Compatible Object Storage)
  - apps/minio/statefulset.yaml
  - apps/minio/service.yaml
  - apps/minio/init-job.yaml
  # k6 (job.yaml은 수동 실행 대상이므로 base에 포함하지 않음. kubectl apply -f apps/k6/job.yaml 으로 개별 실행)
  - apps/k6/configmap.yaml
  # Traefik
  - traefik/middleware/rate-limit.yaml
  - traefik/ingress-routes/api.yaml
  - traefik/ingress-routes/monitoring.yaml
  # Cloudflare
  - cloudflare/tunnel-deployment.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - apps/grafana/dashboards/spring-boot-19004.json
      - apps/grafana/dashboards/token-blacklist-security.json
    options:
      disableNameSuffixHash: true
