spring:
  datasource:
    url: jdbc:h2:mem:outbox-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  flyway:
    enabled: false

  jackson:
    use-jackson2-defaults: true

logging:
  level:
    org.springframework.modulith: DEBUG
