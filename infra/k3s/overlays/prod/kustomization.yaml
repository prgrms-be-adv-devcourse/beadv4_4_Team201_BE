apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/prgrms-be-adv-devcourse/beadv4_4_team201_be/api-server
    newTag: SET_BY_CICD

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Job
      name: minio-init
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-server
      spec:
        template:
          spec:
            containers:
              - name: api-server
                startupProbe:
                  httpGet:
                    path: /actuator/health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 60
                readinessProbe:
                  initialDelaySeconds: 5
                livenessProbe:
                  initialDelaySeconds: 10

  # --- Monitoring IngressRoute: *.localhost → *.chan99k.dev ---
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: grafana-ingress
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`giftify-grafana.chan99k.dev`)"
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: prometheus-ingress
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`giftify-prometheus.chan99k.dev`)"
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: redpanda-ingress
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`giftify-redpanda.chan99k.dev`)"
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: redpanda-console-ingress
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`giftify-redpanda-console.chan99k.dev`)"
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: minio-console-ingress
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`giftify-minio.chan99k.dev`)"
