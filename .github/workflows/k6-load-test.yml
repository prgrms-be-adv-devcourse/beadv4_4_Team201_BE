# ★ Insight ─────────────────────────────────────
# workflow_dispatch: GitHub Actions에서 수동으로 트리거하는 이벤트.
# Actions 탭 > 워크플로우 선택 > "Run workflow" 버튼으로 실행.
# inputs로 시나리오, VU 수, 지속 시간을 실행 시점에 선택 가능.
#
# 자동 트리거(push, schedule)를 안 쓰는 이유:
# 부하테스트는 prod 환경에 실제 부하를 주므로
# 의도하지 않은 실행을 방지하기 위해 수동 트리거만 허용.
# ─────────────────────────────────────────────────
name: k6 Load Test

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: '테스트 시나리오'
        type: choice
        options:
          - business-scenario
          - concurrency-test
          - smoke-test
      vus:
        description: 'Virtual Users (concurrency-test는 무시됨)'
        type: number
        default: 50
      duration:
        description: '지속 시간 (concurrency-test는 무시됨)'
        type: string
        default: '2m'
      mock_auth:
        description: 'Phase 1 Mock Auth (true=Mock 헤더, false=Auth0 JWT)'
        type: boolean
        default: false

# ★ 설계 의도 ─────────────────────────────────────
# concurrency-test는 shared-iterations executor를 사용하므로
# --vus, --duration CLI 플래그가 무시된다.
# 스크립트 내부의 options.scenarios 설정이 우선 적용됨.
# business-scenario와 smoke-test만 CLI 오버라이드 가능.
# ─────────────────────────────────────────────────

jobs:
  load-test:
    runs-on: ubuntu-latest
    # 수동 승인 필수 — 의도하지 않은 부하테스트 실행 방지
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          # Cloudflare Access Service Token (loadtest 서브도메인 인증)
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # Phase 1 Mock Auth 모드 (DynamicMockAuthFilter 연동)
          MOCK_AUTH: ${{ inputs.mock_auth }}
          # 동시성 테스트용 (business-scenario에서도 사용 가능)
          TEST_RECEIVER_ID: ${{ secrets.TEST_RECEIVER_ID }}
          TEST_FUNDING_ID: ${{ secrets.TEST_FUNDING_ID }}
          TEST_WISHLIST_ITEM_ID: ${{ secrets.TEST_WISHLIST_ITEM_ID }}
        run: |
          k6 run \
            --vus ${{ inputs.vus }} \
            --duration ${{ inputs.duration }} \
            --out json=results.json \
            infra/monitoring/k6/scripts/${{ inputs.scenario }}.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ inputs.scenario }}
          path: results.json
          retention-days: 30
