# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# 모든 라이브러리 버전을 한 곳에서 관리
# Core
java = "21"
kotlin = "1.9.22"
springBoot = "3.3.5"
springModulith = "1.1.2"
springDependencyManagement = "1.1.4"

# Database
mysql = "8.3.0"
h2 = "2.2.224"
postgresql = "42.7.3"
querydsl = "5.0.0"

# Security & Utils
jwt = "4.4.0"
dotenv = "3.0.0"
jackson = "2.16.1"

# Testing
kotest = "5.8.0"
mockk = "1.13.9"
restAssured = "5.4.0"

# Monitoring
micrometer = "1.12.2"

# Documentation
springdoc = "2.3.0"

[libraries]
# --- Spring Boot ---
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBoot" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client", version.ref = "springBoot" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }

# --- QueryDSL ---
querydsl-jpa = { module = "com.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "com.querydsl:querydsl-apt", version.ref = "querydsl" }

# --- Security & Utils ---
java-jwt = { module = "com.auth0:java-jwt", version.ref = "jwt" }
dotenv-java = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }

# --- Kotlin ---
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# --- Spring Modulith ---
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }
spring-modulith-events-kafka = { module = "org.springframework.modulith:spring-modulith-events-kafka" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# --- Database ---
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# --- Testing ---
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }

# --- Monitoring ---
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# --- Documentation ---
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[bundles]
spring-boot-web = [
    "spring-boot-starter-web",
    "spring-boot-starter-validation",
    "jackson-module-kotlin",
    "kotlin-reflect",
    "kotlin-stdlib"
]

spring-boot-jpa = [
    "spring-boot-starter-data-jpa",
    "spring-modulith-starter-jpa"
]

kotlin-full = [
    "kotlin-stdlib",
    "kotlin-reflect"
]

testing = [
    "spring-boot-starter-test",
    "kotest-runner-junit5",
    "kotest-assertions-core",
    "mockk"
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }