# CI Pipeline (Merge)
# main/develop 브랜치 푸시 시 빠른 검증 및 배포
name: CI

on:
  push:
    branches: [ develop, main ]
    tags-ignore: [ '**' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api-server

jobs:
  # 1. 빌드 및 테스트
  build:
    name: Build & Test
    uses: ./.github/workflows/_build.yml
    with:
      java-version: '21'
      run-tests: true
      # 머지 단계에서는 커버리지 리포트 생략 (PR에서 이미 검증됨)
      generate-coverage: false
      # Docker 빌드에서 JAR 사용
      upload-jar: true
      publish-build-scan: true

  # 2. Docker 이미지 빌드 및 GHCR 푸시 (main 브랜치만)
  docker:
    name: Build & Push Docker Image
    needs: [ build ]
    runs-on: ubuntu-latest
    # main 브랜치에서만 이미지 푸시
    if: github.ref_name == 'main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 브랜치는 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Git SHA (short)
            type=sha,prefix=,format=short
            # 브랜치명
            type=ref,event=branch

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bootstrap/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # CI용 스테이지 사용 (호스트에서 JAR 직접 복사)
          target: runtime-ci
