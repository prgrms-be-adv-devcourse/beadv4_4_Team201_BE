apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: giftify-image-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  registries:
    - name: GitHub Container Registry
      apiURL: https://ghcr.io
      prefix: ghcr.io
      credentials: pullsecret:argocd/ghcr-creds
  applicationRefs:
    - namePattern: "giftify"
      images:
        - alias: api-server
          imageName: ghcr.io/prgrms-be-adv-devcourse/beadv4_4_team201_be/api-server
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
