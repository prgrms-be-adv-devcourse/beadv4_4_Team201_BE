# 1. API 접속용 (Spring Boot용)
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch # 앱에서 사용하는 이름
  namespace: giftify
spec:
  selector:
    app: elasticsearch # StatefulSet의 포드 라벨과 일치해야 함
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP # 가상 IP 부여 (기본값)

---
# 2. 클러스터 내부 통신용 (기존 설정)
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless # 이름을 살짝 바꿔주는 게 관례입니다.
  namespace: giftify
spec:
  clusterIP: None
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      name: http
    - port: 9300
      name: transport