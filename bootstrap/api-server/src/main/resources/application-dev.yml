# 개발 환경 (docker-compose, 개발 서버)
# PostgreSQL 사용, 환경변수로 접속 정보 주입
spring:
  modulith:
    runtime:
      flyway-enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/giftify_db}
    username: ${DB_USERNAME:giftify}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO g7app, public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200} # ES는 HTTP REST API로 통신하기 때문에 전체 URL을 지정하는 uris를 사용

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false              # 기동 시 배치 잡 자동 실행 방지

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: g7app
        generate_statistics: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    schemas: g7app
    default-schema: g7app
    create-schemas: true

  sql:
    init:
      mode: never

management:
  metrics:
    tags:
      application: ${spring.application.name:giftify}
      env: dev
