[versions]
# =============================================================================
# Core Versions
# =============================================================================
java = "21" # Version reference 'java' is not used in build scripts
springBoot = "3.4.1"
springDependencyManagement = "1.1.7"
springModulith = "1.3.1"

# =============================================================================
# Database & ORM
# =============================================================================
postgresql = "42.7.3"
h2 = "2.2.224"
querydsl = "5.1.0"

# =============================================================================
# Security
# =============================================================================
jwt = "4.4.0"

# =============================================================================
# Utilities
# =============================================================================
lombok = "1.18.30"
dotenv = "3.0.0"

# =============================================================================
# Testing
# =============================================================================
archunit = "1.3.0"
restAssured = "5.4.0"
testcontainers = "1.19.3"

# =============================================================================
# Monitoring & Docs
# =============================================================================
micrometer = "1.12.2"
springdoc = "2.8.9"

[libraries]
# =============================================================================
# Spring Boot Starters (버전은 BOM에서 관리)
# =============================================================================
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }

# =============================================================================
# Spring Modulith
# =============================================================================
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-starter-core", version.ref = "springModulith" }
spring-modulith-jdbc = { module = "org.springframework.modulith:spring-modulith-starter-jdbc", version.ref = "springModulith" }
spring-modulith-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa", version.ref = "springModulith" }
spring-modulith-test = { module = "org.springframework.modulith:spring-modulith-starter-test", version.ref = "springModulith" }

# =============================================================================
# Spring Security
# =============================================================================
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# =============================================================================
# Database
# =============================================================================
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# =============================================================================
# QueryDSL
# =============================================================================
querydsl-jpa = { module = "com.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "com.querydsl:querydsl-apt", version.ref = "querydsl" }

# =============================================================================
# Jakarta (for QueryDSL annotation processing)
# =============================================================================
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }

# =============================================================================
# Lombok
# =============================================================================
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# =============================================================================
# Security & Utils
# =============================================================================
java-jwt = { module = "com.auth0:java-jwt", version.ref = "jwt" }
dotenv = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }

# =============================================================================
# Testing
# =============================================================================
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version = "2.2.2" }

# =============================================================================
# Monitoring & Documentation
# =============================================================================
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
