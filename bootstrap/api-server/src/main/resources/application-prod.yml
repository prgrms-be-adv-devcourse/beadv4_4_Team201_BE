spring:
  modulith:
    runtime:
      flyway-enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO g7app, public

  h2:
    console:
      enabled: false  # 운영 환경에서는 비활성화

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: g7app

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    schemas: g7app
    default-schema: g7app
    create-schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  elasticsearch:
    uris: ${ES_URIS} # ES는 HTTP REST API로 통신하기 때문에 전체 URL을 지정하는 uris를 사용
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  batch:
    jdbc:
      initialize-schema: never   # Batch 메타데이터 테이블 직접 생성 필요
    job:
      enabled: false              # 기동 시 배치 잡 자동 실행 방지


logging:
  level:
    root: WARN
    app.giftify: INFO


management:
  metrics:
    tags:
      application: ${spring.application.name:giftify}
      env: prod