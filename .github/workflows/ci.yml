# CI Pipeline (Merge)
# main/develop 브랜치 푸시 시 빠른 검증 및 배포
name: CI

on:
  push:
    branches: [ develop ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '*.md'
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:
    inputs:
      verbose:
        description: '디버깅을 위한 상세 로그 출력'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api-server

jobs:
  # 1. 빌드 및 테스트
  build:
    name: Build & Test
    uses: ./.github/workflows/_build.yml
    with:
      java-version: '25'
      # [최적화] push 이벤트이고, 브랜치가 main이면 테스트 생략 (머지 큐에서 이미 했으므로)
      # 그 외(merge_group, develop 브랜치 push 등)는 테스트 수행
      run-tests: ${{ github.event_name != 'push' || github.ref_name != 'main' }}
      # 머지 단계에서는 커버리지 리포트 생략 (PR에서 이미 검증됨)
      generate-coverage: false
      # Docker 빌드에서 JAR 사용
      upload-jar: true
      publish-build-scan: true
      verbose: ${{ inputs.verbose || false }}

  # 2. Docker 이미지 빌드 및 GHCR 푸시 (main 브랜치만)
  docker:
    name: Build & Push Docker Image
    needs: [ build ]
    runs-on: ubuntu-latest
    # main 브랜치에서만 이미지 푸시
    if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on develop
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --unshallow origin develop || git fetch origin develop
          TAG_SHA=$(git rev-parse HEAD)
          DEV_SHA=$(git rev-parse origin/develop)
          echo "Tag SHA:     $TAG_SHA"
          echo "Develop SHA: $DEV_SHA"
          if [ "$TAG_SHA" != "$DEV_SHA" ]; then
            echo "::error::Tag must be created from develop HEAD. Tag points to $TAG_SHA but develop is at $DEV_SHA"
            exit 1
          fi
          echo "Tag is on develop HEAD"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 브랜치는 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Git SHA (short)
            type=sha,prefix=,format=short
            # 브랜치명
            type=ref,event=branch
            # Semantic version (v1.2.3 -> 1.2.3, 1.2)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bootstrap/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # CI용 스테이지 사용 (호스트에서 JAR 직접 복사)
          target: runtime-ci

  # 3. 릴리스 태그 시 자동 배포 (staging → prod)
  # GitHub Web UI에서 릴리스 생성 → Git 태그(v0.0.22) 푸시 →
  # Docker 이미지 태그(0.0.22)로 빌드+배포. 별도 커밋 없이 릴리스만으로 배포 완료.
  #
  # ArgoCD Image Updater v1.1.1이 ArgoCD v3.3.4의
  # Application.status.sourceType 빈 값 문제로 동작하지 않아,
  # WIF + IAP 터널을 통해 직접 배포하는 방식으로 전환.
  deploy:
    name: Deploy to Staging & Prod
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv4_4_team201_be/api-server
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Deploy to Staging
        run: |
          gcloud compute ssh giftify-staging \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --command="
              set -e &&
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml &&
              POD=\$(sudo kubectl get pod -n argocd -l app.kubernetes.io/name=argocd-server -o jsonpath='{.items[0].metadata.name}') &&
              sudo kubectl exec -n argocd \$POD -- argocd login localhost:8080 \
                --username=admin --password='${{ secrets.ARGOCD_ADMIN_PASSWORD_STAGING }}' --insecure --plaintext &&
              sudo kubectl exec -n argocd \$POD -- argocd app set giftify --kustomize-image \
                ${{ env.IMAGE }}:${{ steps.tag.outputs.version }} &&
              sudo kubectl exec -n argocd \$POD -- argocd app sync giftify --prune --retry-limit 3 &&
              sudo kubectl exec -n argocd \$POD -- argocd app wait giftify --health --timeout 300
            "

      - name: Deploy to Prod
        run: |
          gcloud compute ssh giftify-app \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --command="
              set -e &&
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml &&
              POD=\$(sudo kubectl get pod -n argocd -l app.kubernetes.io/name=argocd-server -o jsonpath='{.items[0].metadata.name}') &&
              sudo kubectl exec -n argocd \$POD -- argocd login localhost:8080 \
                --username=admin --password='${{ secrets.ARGOCD_ADMIN_PASSWORD_PROD }}' --insecure --plaintext &&
              sudo kubectl exec -n argocd \$POD -- argocd app set giftify --kustomize-image \
                ${{ env.IMAGE }}:${{ steps.tag.outputs.version }} &&
              sudo kubectl exec -n argocd \$POD -- argocd app sync giftify --prune --retry-limit 3 &&
              sudo kubectl exec -n argocd \$POD -- argocd app wait giftify --health --timeout 300
            "

      - name: Discord Notification
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            TITLE="Deploy Success"
            DESC="**v${{ steps.tag.outputs.version }}** deployed to staging+prod"
          else
            COLOR=15158332
            TITLE="Deploy Failed"
            DESC="**v${{ steps.tag.outputs.version }}** failed. [Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"$DESC\",\"color\":$COLOR}]}"
